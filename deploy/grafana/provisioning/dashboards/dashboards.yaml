# Load every dashboard JSON baked into the image at /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: toybloom
    orgId: 1
    folder: toybloom
    type: file
    disableDeletion: false
    editable: true
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
