# Prometheus scrapes the Collector's Prometheus exporter. Exemplar storage is
# enabled via a command-line flag in docker-compose.yml (--enable-feature=
# exemplar-storage); this file only defines what to scrape.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    # The Collector re-exports app metrics here in OpenMetrics format (with
    # exemplars). Scraping OpenMetrics is what lets Prometheus store exemplars.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
