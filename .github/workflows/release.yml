name: release

# Cut a release by pushing a semver tag: `git tag vX.Y.Z && git push --tags`.
# GoReleaser builds the binaries, publishes the GitHub Release, and pushes the
# container image to ghcr.io. Config lives in .goreleaser.yaml.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release + upload archives
  packages: write # push the image to ghcr.io

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog can diff from the last tag

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
