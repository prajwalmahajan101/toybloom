# Local observability stack (M9 / ADR 0005). One command brings up the app, its
# Valkey store, and the full LGTM pipeline. The app emits one OTLP/gRPC stream to
# the Collector, which fans out to Prometheus / Tempo / Loki behind Grafana.
#
#   docker compose up --build
#   open http://localhost:3000   (Grafana, anonymous admin)

name: toybloom

services:
  app:
    build:
      context: .
      args:
        VERSION: dev
    environment:
      OBS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: toybloom
      VALKEY_ADDR: valkey:6379
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      - valkey
      - otel-collector

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  otel-collector:
    # Core distro (not contrib): this config uses only core components (otlp
    # receiver; batch/memory_limiter; prometheus/otlp/otlphttp exporters).
    image: otel/opentelemetry-collector:0.160.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC (also reachable from the host for dev)
      - "8889:8889" # Prometheus exporter (scraped by Prometheus)
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--enable-feature=exemplar-storage"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.7.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.3.0
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
